<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Node 1: 市场数据 -->
  <rect x="80" y="20" width="200" height="56" rx="18" fill="#EEF1FB" stroke="#3157D5" stroke-width="1.5"/>
  <text x="180" y="40" text-anchor="middle" fill="#3157D5" font-size="13" font-weight="700">📊 市场数据</text>
  <text x="180" y="60" text-anchor="middle" fill="#626262" font-size="11">生意参谋 · 边界 BI</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="76" x2="180" y2="106" stroke="#C5C9D6" stroke-width="1.5"/>
  <polygon points="174,104 180,114 186,104" fill="#C5C9D6"/>

  <!-- Node 2: 价格区间 -->
  <rect x="80" y="116" width="200" height="56" rx="18" fill="#EEF1FB" stroke="#3157D5" stroke-width="1.5"/>
  <text x="180" y="136" text-anchor="middle" fill="#3157D5" font-size="13" font-weight="700">💰 价格区间</text>
  <text x="180" y="156" text-anchor="middle" fill="#626262" font-size="11">销量占比 · 变化趋势</text>

  <!-- Arrow 2→3 -->
  <line x1="180" y1="172" x2="180" y2="202" stroke="#C5C9D6" stroke-width="1.5"/>
  <polygon points="174,200 180,210 186,200" fill="#C5C9D6"/>

  <!-- Node 3: 竞品拆解 -->
  <rect x="80" y="212" width="200" height="56" rx="18" fill="#EEF1FB" stroke="#3157D5" stroke-width="1.5"/>
  <text x="180" y="232" text-anchor="middle" fill="#3157D5" font-size="13" font-weight="700">🔍 竞品拆解</text>
  <text x="180" y="252" text-anchor="middle" fill="#626262" font-size="11">产品结构 · 价格策略 · 卖点</text>

  <!-- Arrow 3→4 -->
  <line x1="180" y1="268" x2="180" y2="298" stroke="#C5C9D6" stroke-width="1.5"/>
  <polygon points="174,296 180,306 186,296" fill="#C5C9D6"/>

  <!-- Node 4: 产品规划建议 -->
  <rect x="60" y="308" width="240" height="56" rx="18" fill="#3157D5" stroke="#3157D5" stroke-width="1.5"/>
  <text x="180" y="332" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">📋 产品规划建议</text>
  <text x="180" y="352" text-anchor="middle" fill="#CBD5F5" font-size="11">价格定位 · 产品结构优化</text>

  <!-- Bottom label -->
  <text x="180" y="410" text-anchor="middle" fill="#999" font-size="11">分析路径示意图 — 仅表达方法流程</text>
</svg>
